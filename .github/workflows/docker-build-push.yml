# ============================================================================
# Shell Town（拾贝小镇）—— 构建 x86_64（linux/amd64）镜像并推送到 Docker Hub
#
#   为什么只有 amd64：本应用只在 Intel/AMD 的 NAS 上用。
#   单架构不需要 QEMU 模拟，构建更快，也避开了 arm64 特有的原生编译问题。
#   将来真要 arm64，把 platforms 加回「,linux/arm64」并恢复 QEMU 步骤即可
#   （注意：better-sqlite3 在 musl+arm64 下没有预编译包，会现场编 SQLite，很慢）。
#
# 怎么用（只在需要出新镜像时才跑，不会自动乱跑）：
#   GitHub 仓库页 → Actions → 左侧选「docker-build-push」
#   → 右侧 Run workflow → 填镜像标签（留空 = latest）→ Run
#
# 前置条件（每个仓库只需做一次）：
#   仓库 Settings → Secrets and variables → Actions → Secrets 分页 → New secret
#     DOCKERHUB_USERNAME = aaron2024s            ← 必须全小写
#     DOCKERHUB_TOKEN    = Docker Hub 访问令牌（不是登录密码）
#   必须建在 Secrets 分页，建在旁边的 Variables 分页等于没建。
#
# 本项目构建偏慢的原因：better-sqlite3 是 native 模块，alpine(musl) 下没有现成预编译包，
# 必须在容器里用 g++ 现场编译整个 SQLite 源码（约 25 万行 C）。
# 但因为是单架构（x86 构建机造 x86 镜像），**全程不经过 QEMU**，这一步就是原生速度。
# 首次无缓存预计 8~15 分钟；跑完会留下 GitHub 缓存，之后会明显变快。
# ============================================================================
name: docker-build-push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空 = latest）'
        required: false
        default: 'latest'
        type: string

  # 想让「打 git tag 就自动构建」：把下面两行的 # 去掉即可。
  # tag 名会直接当镜像标签用，例如 git tag v1.7.0 → 镜像 aaron2024s/shell-town:v1.7.0
  # push:
  #   tags: ['v*']

env:
  IMAGE_NAME: shell-town

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      # 只构建 x86，因此**不需要 QEMU**（已移除 setup-qemu 步骤）。
      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # 手动触发时用你填的标签；若改用 tag 触发，则自动用 tag 名
          tags: ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把结果写进运行摘要，跑完在页面顶部能直接看到镜像名和 digest
      - name: 结果汇总
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 名称：\`$DOCKERHUB_USER/$IMAGE_NAME:${{ inputs.tag || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 架构：\`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 摘要：\`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 拉取：\`docker pull $DOCKERHUB_USER/$IMAGE_NAME:${{ inputs.tag || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
